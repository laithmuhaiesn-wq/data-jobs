name: collect-hourly

# CHEAP shops every hour: SmartBuy, eStoreJO (Shopify JSON), GTS and City Center (one listing page each). About 40 seconds together,
# so one run is billed as 1 minute (about 720 minutes a month). Same polite rules as always (robots.txt, 3 s between requests per shop).
# Needs repository secret DATABASE_URL.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: collect-queue
  cancel-in-progress: false

# the job only reads the code; it can never push, open issues or change settings
permissions:
  contents: read

jobs:
  collect:
    # Collection runs in the public runner copy (laithmuhaiesn-wq/data-jobs: unlimited free minutes). In the private project it runs only
    # while the repository variable COLLECT_HERE is 'true' (used during the move, and as a fallback).
    if: github.repository == 'laithmuhaiesn-wq/data-jobs' || vars.COLLECT_HERE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres,api]"
      - name: Collect (one shop failing does not stop the others)
        run: |
          failed=0
          for s in smartbuy estorejo gts citycenter ammar igeek xmart dna compujordan newvision cse midteks osjo smartsystems almohanad pccircle h4m; do
            echo "== $s"
            python -m pricecompare.cli collect "$s" || { echo "::error::$s failed"; failed=1; }
          done
          exit $failed
      - if: always()
        run: python -m pricecompare.cli match
      - if: always()
        name: Grow the catalog (new models, same checks as the nightly), then match again
        run: python -m pricecompare.cli auto-grow && python -m pricecompare.cli match
      # The public website: one page per product, rebuilt from the database and published to derbani.com every hour.
      # Skipped until the two Cloudflare secrets exist. A build with too few products stops here and publishes nothing.
      - name: Build the website
        id: web
        if: always()
        run: python -m pricecompare.cli build-web
      - name: List new pages for search engines
        id: newpages
        if: ${{ always() && steps.web.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: python -m pricecompare.cli indexnow-prepare
      - name: Data health for the owner's dashboard (stored in Cloudflare D1, nothing printed)
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: python -m pricecompare.cli push-health
      - name: Publish derbani.com
        id: publish
        if: ${{ always() && steps.web.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy
      # Bing and other IndexNow engines learn about new pages within hours (Google reads the sitemap instead).
      # Once a run, only new addresses plus the home and deals pages. A failure here never fails the run.
      - name: Tell search engines about new pages
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        run: python -m pricecompare.cli indexnow-send

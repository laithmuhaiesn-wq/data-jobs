name: collect-fast

# Action (about 30 seconds) every 3 hours, 8 times a day. The other cheap shops run every hour in collect-hourly.yml.
# Same polite rules as always (robots.txt, 3 s between requests per shop, honest user agent). Needs repository secret DATABASE_URL.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect-queue
  cancel-in-progress: false

# the job only reads the code; it can never push, open issues or change settings
permissions:
  contents: read

jobs:
  collect:
    # Collection runs in the public runner copy (laithmuhaiesn-wq/data-jobs: unlimited free minutes). In the private project it runs only
    # while the repository variable COLLECT_HERE is 'true' (used during the move, and as a fallback).
    if: github.repository == 'laithmuhaiesn-wq/data-jobs' || vars.COLLECT_HERE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres]"
      - name: Check database login first (fail loudly, before collecting)
        run: python -c "from sqlalchemy import text; from pricecompare.db.session import get_engine; get_engine().connect().execute(text('select 1')); print('db ok')"
      - name: Collect (one shop failing does not stop the others)
        run: |
          failed=0
          for s in action; do
            echo "== $s"
            python -m pricecompare.cli collect "$s" || { echo "::error::$s failed"; failed=1; }
          done
          exit $failed
      - if: always()
        run: python -m pricecompare.cli match

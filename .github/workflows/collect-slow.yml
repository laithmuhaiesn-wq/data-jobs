name: collect-slow

# The SLOW shops (iService, Leaders, Platinum: about 20 minutes together) every 4 hours. Until 2026-11 the owner's PC did
# this (scripts/collect_pc.ps1); the public runner has unlimited free minutes, so it runs here now. The hourly job matches
# what this collects. Own queue: a long run here never makes GitHub drop a waiting hourly run.
on:
  schedule:
    - cron: "40 1,5,9,13,17 * * *"   # every 4 h; the 21:40 slot is left out (the nightly run at 22:30 reads these shops)
  workflow_dispatch: {}

concurrency:
  group: slow-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'laithmuhaiesn-wq/data-jobs' || vars.COLLECT_HERE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres]"
      - name: Collect (one shop failing does not stop the others)
        run: |
          failed=0
          for s in iservice leaders platinum; do
            echo "== $s"
            python -m pricecompare.cli collect "$s" || { echo "::error::$s failed"; failed=1; }
          done
          for s in iservice platinum; do   # Stage 3 electronics sections (cli.ELECTRONICS), after the main lists
            echo "== $s electronics"
            python -m pricecompare.cli collect "$s" --part electronics || { echo "::error::$s electronics failed"; failed=1; }
          done
          exit $failed

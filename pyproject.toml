[project]
name = "pricecompare"
version = "0.1.0"
description = "Jordan price comparison - phase 0 collectors"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "sqlalchemy>=2.0", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
pricecompare = "pricecompare.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
